name: Ingesta programada

# Corre todos los conectores (fuentes nacionales/provinciales + los ~22
# municipios) contra la base remota en Turso, y despues actualiza estado
# en vivo y renglones de COMPR.AR. Reemplaza correr esto a mano.
#
# Requiere estos secrets configurados en Settings > Secrets and variables
# > Actions del repo (los mismos valores que en .env / Vercel):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN

on:
  schedule:
    # Todos los dias a las 09:00 UTC (06:00 hora Argentina). Ajustar segun
    # necesidad -- una corrida completa tarda varios minutos (varios
    # conectores usan Playwright).
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # permite disparar manualmente desde la pestaña Actions

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Ingesta completa (todas las fuentes)
        run: python -m src.ingest

      - name: Estado en vivo (COMPR.AR, Mendoza, OSEP)
        run: python -m src.refresh_live

      - name: Renglones de COMPR.AR vigentes
        run: python -m src.backfill_items
