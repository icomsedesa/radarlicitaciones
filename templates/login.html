<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingresar · Radar de Licitaciones</title>
<link rel="icon" href="{{ url_for('static', filename='isotipo.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-teal:#007068; --brand-teal-dark:#00504a;
    --bg:#EFF4F2; --surface:#FFFFFF; --border:#D6E0DC; --text:#122420; --text-muted:#57655F;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:'Public Sans',-apple-system,'Segoe UI',sans-serif;}
  .box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px;width:100%;max-width:340px;box-shadow:0 8px 24px -12px rgba(0,0,0,.15);text-align:center;}
  img.logo{height:48px;margin-bottom:16px;}
  h1{font-size:18px;margin:0 0 4px;}
  p.sub{color:var(--text-muted);font-size:13px;margin:0 0 22px;}
  .flash{background:#F7DCD8;color:#C0392B;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:left;}
  a.google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;
    border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);
    font-weight:600;font-size:14px;text-decoration:none;box-sizing:border-box;
  }
  a.google-btn:hover{background:var(--bg);}
  a.google-btn svg{flex-shrink:0;}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="{{ url_for('static', filename='isotipo.png') }}" alt="">
    <h1>Radar de Licitaciones</h1>
    <p class="sub">Acceso restringido a cuentas @{{ dominio }}.</p>
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <a class="google-btn" href="{{ url_for('login_google', next=request.args.get('next', '')) }}">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.9c1.7-1.57 2.7-3.87 2.7-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.27c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.71H.95v2.34C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.96H.95A9 9 0 000 9c0 1.45.35 2.83.95 4.04l3-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3 2.34C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Ingresar con Google
    </a>
  </div>
</body>
</html>
